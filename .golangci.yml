version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/zarathos364/opencode-memory
